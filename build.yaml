# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
 - board: seeeduino_xiao_ble
   shield: roBa_R
   snippet: studio-rpc-usb-uart
 - board: seeeduino_xiao_ble
   shield: roBa_L
 - board: seeeduino_xiao_ble
   shield: settings_reset
 # 2号機: 同じroBa_Rシールドをcmake-argsで上書きしてビルド(名前・トラックボール設定を独立管理)
 # 値はroba-tunerツールが書き換える。手動編集する場合は1行のまま保つこと
 - board: seeeduino_xiao_ble
   shield: roBa_R
   artifact-name: roBa2_R
   snippet: zmk-usb-logging
   cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME='"roBa-ish-m"' -DCONFIG_PMW3610_CPI=801 -DCONFIG_PMW3610_CPI_DIVIDOR=1 -DCONFIG_PMW3610_ORIENTATION_180=y -DCONFIG_PMW3610_SCROLL_TICK=17 -DCONFIG_PMW3610_INVERT_X=n -DCONFIG_PMW3610_INVERT_SCROLL_X=y -DCONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264 -DCONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20 -DCONFIG_PMW3610_POLLING_RATE_125_SW=y -DCONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700 -DCONFIG_PMW3610_MOVEMENT_THRESHOLD=0 -DCONFIG_PMW3610_SMART_ALGORITHM=y -DCONFIG_ZMK_INPUT_PROCESSOR_ACCEL_MIN_FACTOR=100 -DCONFIG_ZMK_INPUT_PROCESSOR_ACCEL_MAX_FACTOR=100 -DCONFIG_ZMK_INPUT_PROCESSOR_ACCEL_SPEED_MIN=3 -DCONFIG_ZMK_INPUT_PROCESSOR_ACCEL_SPEED_MAX=18 -DCONFIG_ZMK_INPUT_PROCESSOR_SCROLL_INERTIA_ENABLED=n -DCONFIG_ZMK_INPUT_PROCESSOR_SCROLL_INERTIA_DECAY_PERCENT=80 -DCONFIG_ZMK_INPUT_PROCESSOR_SCROLL_INERTIA_MIN_VELOCITY=1 -DCONFIG_ZMK_INPUT_PROCESSOR_SCROLL_INERTIA_START_THRESHOLD=5 -DCONFIG_ZMK_INPUT_PROCESSOR_SCROLL_INERTIA_TICK_MS=30 -DCONFIG_ZMK_INPUT_PROCESSOR_SCROLL_INERTIA_SMOOTHING=0
